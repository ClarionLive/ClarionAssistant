<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- COM Controls / IDE Addins tab (d4e941e3). One page for both kinds: ProjectsWebView passes
     ?kind=com|addin, and the list shows that kind plus legacy "Other" projects so they stay reachable.
     Moved off the Home dashboard because developers read the table there as "one project per app". -->
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', sans-serif;
  font-size: 13px;
  background: #1e1e2e;
  color: #cdd6f4;
  overflow-y: auto;
  overflow-x: hidden;
  user-select: none;
  -webkit-user-select: none;
}
.page {
  max-width: 1000px;
  margin: 0 auto;
  padding: 24px 24px 32px;
}

/* Section header */
.section-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px; gap: 12px;
}
.section-title { font-size: 18px; font-weight: 600; color: #89b4fa; }
.section-subtitle { font-size: 12px; color: #6c7086; margin-top: 2px; }

/* What-this-is box: the reason this page exists */
.explainer {
  display: flex; gap: 12px; align-items: flex-start;
  padding: 12px 14px; margin: 4px 0 18px;
  background: rgba(137,180,250,0.08); border: 1px solid rgba(137,180,250,0.25);
  border-left: 3px solid #89b4fa; border-radius: 6px;
  font-size: 12px; line-height: 1.5; color: #bac2de;
}
.explainer .ico { font-size: 18px; line-height: 1; margin-top: 1px; }
.explainer b { color: #cdd6f4; }
.explainer .not { color: #f9e2af; font-weight: 600; }

/* Buttons */
.btn {
  height: 28px; padding: 0 14px;
  border: 1px solid #45475a; border-radius: 4px;
  background: #313244; color: #cdd6f4;
  font-size: 12px; font-family: 'Segoe UI', sans-serif;
  cursor: pointer; white-space: nowrap;
  transition: all 0.15s;
  display: inline-flex; align-items: center; gap: 6px;
}
.btn:hover { background: #45475a; border-color: #585b70; }
.btn:active { background: #585b70; }
.btn-primary { background: #1e66a8; border-color: #2580d4; color: #fff; font-weight: 600; }
.btn-primary:hover { background: #2580d4; }
.btn-lg { height: 36px; padding: 0 20px; font-size: 13px; }

/* Table controls */
.table-controls {
  display: flex; justify-content: space-between;
  align-items: center; margin-bottom: 8px; gap: 16px;
}
.page-size-wrap { display: flex; align-items: center; gap: 6px; color: #7f849c; font-size: 12px; }
.page-size-wrap select {
  background: #313244; border: 1px solid #45475a;
  color: #cdd6f4; font-size: 12px;
  padding: 2px 6px; border-radius: 3px;
  cursor: pointer; font-family: 'Segoe UI', sans-serif; outline: none;
}
.search-wrap { display: flex; align-items: center; gap: 8px; color: #7f849c; font-size: 12px; }
.search-wrap input {
  background: #313244; border: 1px solid #45475a;
  color: #cdd6f4; font-size: 12px;
  padding: 3px 8px; border-radius: 3px;
  font-family: 'Segoe UI', sans-serif; width: 190px; outline: none;
}
.search-wrap input:focus { border-color: #89b4fa; }

/* Projects table */
.projects-table { width: 100%; border-collapse: collapse; margin-bottom: 8px; }
.projects-table thead th {
  text-align: left; font-size: 11px; font-weight: 600;
  color: #7f849c; padding: 7px 10px;
  border-top: 1px solid #313244; border-bottom: 1px solid #313244;
  text-transform: uppercase; letter-spacing: 0.4px;
  white-space: nowrap; cursor: pointer;
}
.projects-table thead th:hover { color: #a6adc8; }
.projects-table thead th .sort-arrow { margin-left: 3px; opacity: 0.4; }
.projects-table thead th.sort-asc .sort-arrow,
.projects-table thead th.sort-desc .sort-arrow { opacity: 1; color: #89b4fa; }
.projects-table thead th.col-actions { cursor: default; }
.project-row td { padding: 7px 10px; border-bottom: 1px solid rgba(49,50,68,0.5); font-size: 12px; }
.project-row:hover td { background: rgba(137,180,250,0.04); }
.project-name { color: #89b4fa; cursor: pointer; font-weight: 500; }
.project-name:hover { text-decoration: underline; }

.type-badge {
  display: inline-block; padding: 2px 8px; border-radius: 4px;
  font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px;
}
.type-badge.com { background: rgba(203,166,247,0.15); color: #cba6f7; }
.type-badge.addin { background: rgba(116,199,236,0.15); color: #74c7ec; }
.type-badge.other { background: rgba(108,112,134,0.15); color: #9399b2; }

.row-actions { display: flex; gap: 4px; justify-content: flex-end; }
.icon-btn {
  width: 26px; height: 26px; border: none; border-radius: 4px;
  cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.icon-btn-del { color: #f38ba8; background: rgba(243,139,168,0.1); }
.icon-btn-del:hover { background: rgba(243,139,168,0.22); }
.icon-btn-folder { color: #89b4fa; background: rgba(137,180,250,0.1); }
.icon-btn-folder:hover { background: rgba(137,180,250,0.22); }
.icon-btn-edit { color: #a6e3a1; background: rgba(166,227,161,0.1); }
.icon-btn-edit:hover { background: rgba(166,227,161,0.22); }

/* Table footer */
.table-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
.showing-info { font-size: 11px; color: #6c7086; }
.pagination { display: flex; gap: 3px; }
.page-btn {
  min-width: 28px; height: 26px; padding: 0 6px;
  border: 1px solid #313244; border-radius: 4px;
  background: #252536; color: #7f849c;
  font-size: 11px; cursor: pointer; transition: all 0.15s;
}
.page-btn:hover { background: #313244; }
.page-btn.active { background: #89b4fa; border-color: #89b4fa; color: #1e1e2e; font-weight: 600; }
.page-btn:disabled { opacity: 0.3; cursor: default; }

.no-match { text-align: center; padding: 20px; color: #6c7086; font-size: 12px; }

/* Empty state: no projects of this kind at all */
.empty-hero { text-align: center; padding: 34px 20px 30px; border: 1px dashed #45475a; border-radius: 10px; }
.empty-hero .big { font-size: 34px; margin-bottom: 8px; }
.empty-hero .h { font-size: 14px; font-weight: 600; color: #cdd6f4; margin-bottom: 6px; }
.empty-hero .p { font-size: 12px; color: #a6adc8; max-width: 420px; margin: 0 auto 16px; line-height: 1.5; }

/* Modal */
.modal-overlay {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.55); z-index: 100;
  justify-content: center; align-items: center;
}
.modal-overlay.visible { display: flex; }
.modal {
  background: #1e1e2e; border: 1px solid #45475a; border-radius: 10px;
  padding: 20px; width: 420px; max-width: 90%;
}
.modal-title { font-size: 15px; font-weight: 600; color: #89b4fa; margin-bottom: 16px; }
.form-group { margin-bottom: 12px; }
.form-label { font-size: 11px; color: #7f849c; margin-bottom: 4px; font-weight: 500; display: block; }
.form-input, .form-select {
  width: 100%; height: 32px; padding: 0 10px;
  background: #313244; color: #cdd6f4; border: 1px solid #45475a;
  border-radius: 5px; font-size: 12px; font-family: 'Segoe UI', sans-serif; outline: none;
}
.form-input:focus, .form-select:focus { border-color: #89b4fa; }
.form-select { cursor: pointer; }
.form-error { color: #f38ba8; font-size: 11px; margin-top: 3px; display: none; }
.folder-row { display: flex; gap: 6px; }
.folder-row .form-input { flex: 1; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #45475a; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #585b70; }

/* Light theme */
body.light { background: #eff1f5; color: #4c4f69; }
body.light .section-title { color: #1e66f5; }
body.light .section-subtitle { color: #6c6f85; }
body.light .explainer { background: rgba(30,102,245,0.06); border-color: rgba(30,102,245,0.25); border-left-color: #1e66f5; color: #4c4f69; }
body.light .explainer b { color: #303446; }
body.light .explainer .not { color: #c25e00; }
body.light .btn { background: #e6e9ef; border-color: #bcc0cc; color: #4c4f69; }
body.light .btn:hover { background: #ccd0da; }
body.light .btn-primary { background: #1e66f5; border-color: #1e66f5; color: #fff; }
body.light .btn-primary:hover { background: #3b8cf8; }
body.light .page-size-wrap, body.light .search-wrap { color: #6c6f85; }
body.light .page-size-wrap select { background: #fff; border-color: #bcc0cc; color: #4c4f69; }
body.light .search-wrap input { background: #fff; border-color: #bcc0cc; color: #4c4f69; }
body.light .search-wrap input:focus { border-color: #1e66f5; }
body.light .projects-table thead th { color: #6c6f85; border-color: #bcc0cc; }
body.light .project-row td { border-bottom-color: #dce0e8; }
body.light .project-row:hover td { background: rgba(30,102,245,0.04); }
body.light .project-name { color: #1e66f5; }
body.light .type-badge.com { background: rgba(136,57,239,0.12); color: #8839ef; }
body.light .type-badge.addin { background: rgba(4,165,229,0.12); color: #0485b8; }
body.light .type-badge.other { background: rgba(108,111,133,0.12); color: #5c5f77; }
body.light .icon-btn-del { color: #d20f39; background: rgba(210,15,57,0.1); }
body.light .icon-btn-del:hover { background: rgba(210,15,57,0.22); }
body.light .icon-btn-folder { color: #1e66f5; background: rgba(30,102,245,0.1); }
body.light .icon-btn-folder:hover { background: rgba(30,102,245,0.22); }
body.light .icon-btn-edit { color: #40a02b; background: rgba(64,160,43,0.1); }
body.light .icon-btn-edit:hover { background: rgba(64,160,43,0.22); }
body.light .showing-info, body.light .no-match { color: #6c6f85; }
body.light .page-btn { background: #e6e9ef; border-color: #bcc0cc; color: #4c4f69; }
body.light .page-btn:hover { background: #ccd0da; }
body.light .page-btn.active { background: #1e66f5; border-color: #1e66f5; color: #fff; }
body.light .empty-hero { border-color: #bcc0cc; }
body.light .empty-hero .h { color: #4c4f69; }
body.light .empty-hero .p { color: #5c5f77; }
body.light .modal { background: #eff1f5; border-color: #bcc0cc; }
body.light .modal-title { color: #1e66f5; }
body.light .form-label { color: #6c6f85; }
body.light .form-input, body.light .form-select { background: #e6e9ef; border-color: #bcc0cc; color: #4c4f69; }
body.light .form-input:focus, body.light .form-select:focus { border-color: #1e66f5; }
body.light .modal-overlay { background: rgba(0,0,0,0.35); }
body.light ::-webkit-scrollbar-thumb { background: #bcc0cc; }
body.light ::-webkit-scrollbar-thumb:hover { background: #acb0be; }
</style>
</head>
<body>
<div class="page">
  <div class="section-header">
    <div>
      <div class="section-title" id="pageTitle"></div>
      <div class="section-subtitle" id="pageSubtitle"></div>
    </div>
    <button class="btn btn-primary" id="newBtn" onclick="openProjectModal()"></button>
  </div>

  <div class="explainer">
    <div class="ico" id="explainIcon"></div>
    <div id="explainText"></div>
  </div>

  <div id="listWrap">
    <div class="table-controls">
      <div class="page-size-wrap">
        <select id="projPageSize" onchange="onProjPageSizeChange()">
          <option value="10">10</option>
          <option value="25">25</option>
          <option value="50">50</option>
          <option value="100">100</option>
        </select>
        <span>records</span>
      </div>
      <div class="search-wrap">
        <span>Search:</span>
        <input type="text" id="projSearchInput" oninput="onProjSearch()" />
      </div>
    </div>

    <table class="projects-table">
      <thead>
        <tr>
          <th id="pth-name" onclick="projSortBy('name')">Name <span class="sort-arrow">&#8597;</span></th>
          <th id="pth-type" onclick="projSortBy('type')" style="width:130px">Type <span class="sort-arrow">&#8597;</span></th>
          <th class="col-actions" style="width:90px"></th>
        </tr>
      </thead>
      <tbody id="projectList"></tbody>
    </table>
    <div id="noMatch" class="no-match" style="display:none;">No projects match your search.</div>

    <div class="table-footer">
      <div class="showing-info" id="projShowingInfo"></div>
      <div class="pagination" id="projPagination"></div>
    </div>
  </div>

  <div id="emptyHero" class="empty-hero" style="display:none;">
    <div class="big" id="emptyIcon"></div>
    <div class="h" id="emptyTitle"></div>
    <div class="p" id="emptyText"></div>
    <button class="btn btn-primary btn-lg" id="emptyBtn" onclick="openProjectModal()"></button>
  </div>
</div>

<!-- Add/Edit Project Modal. No type picker: the page's kind decides a new project's type,
     and an existing project keeps the type it has. -->
<div class="modal-overlay" id="projectModal">
  <div class="modal">
    <div class="modal-title" id="modalTitle"></div>
    <input type="hidden" id="modalEditId" value="" />
    <div class="form-group">
      <label class="form-label">Project Name</label>
      <input class="form-input" type="text" id="modalName" placeholder="MyProject" />
      <div class="form-error" id="nameError">Project name is required.</div>
    </div>
    <div class="form-group">
      <label class="form-label">Project Folder</label>
      <div class="folder-row">
        <input class="form-input" type="text" id="modalFolder" placeholder="C:\Projects\MyProject" />
        <button class="btn" onclick="browseProjectFolder()">Browse...</button>
      </div>
      <div class="form-error" id="folderError">Project folder is required.</div>
    </div>
    <div class="form-group">
      <label class="form-label">GitHub Account</label>
      <select class="form-select" id="modalGitHubAccount">
        <option value="">(none)</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Repository Name</label>
      <input class="form-input" type="text" id="modalRepoName" placeholder="e.g. MyProject" />
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeProjectModal()">Cancel</button>
      <button class="btn btn-primary" id="modalSaveBtn" onclick="saveProject()">Create</button>
    </div>
  </div>
</div>

<script>
  /* ==================== Kind ==================== */
  var KINDS = {
    com: {
      type: 'COM Control', icon: '&#129513;',
      title: 'Clarion COM Controls',
      subtitle: 'Reusable .NET controls you can place on any Clarion window',
      newBtn: '&#43; New COM Control',
      modalNew: 'New COM Control',
      explain: 'A <b>COM control</b> is a C# user control (charts, grids, date pickers, web views&hellip;) that you build once and drop onto a Clarion window like any other control. ' +
               '<span class="not">You do not need a project here for each Clarion app</span> &mdash; for normal app work, use <b>Work With Open Solution</b> on the Dashboard.',
      emptyTitle: 'No COM controls yet',
      emptyText: 'Start a COM control when your app needs a UI component Clarion doesn\'t have built in.',
      emptyBtn: 'Create your first COM control'
    },
    addin: {
      type: 'Addin', icon: '&#129520;',
      title: 'Clarion IDE Addins',
      subtitle: 'Extensions that add pads, menus and tools to the Clarion IDE',
      newBtn: '&#43; New IDE Addin',
      modalNew: 'New IDE Addin',
      explain: 'An <b>addin</b> extends the Clarion IDE itself &mdash; new pads, menu commands or editor tools. It doesn\'t go into your application. ' +
               '<span class="not">You do not need a project here for each Clarion app</span> &mdash; for normal app work, use <b>Work With Open Solution</b> on the Dashboard.',
      emptyTitle: 'No IDE addins yet',
      emptyText: 'Start an addin when you want the Clarion IDE to do something new for you or your team, such as a custom pad or a menu command.',
      emptyBtn: 'Create your first IDE addin'
    }
  };

  var params = new URLSearchParams(window.location.search);
  var kindKey = params.get('kind') === 'addin' ? 'addin' : 'com';
  var kind = KINDS[kindKey];
  if (params.get('theme') === 'light') document.body.classList.add('light');

  document.getElementById('pageTitle').textContent = kind.title;
  document.getElementById('pageSubtitle').textContent = kind.subtitle;
  document.getElementById('newBtn').innerHTML = kind.newBtn;
  document.getElementById('explainIcon').innerHTML = kind.icon;
  document.getElementById('explainText').innerHTML = kind.explain;
  document.getElementById('emptyIcon').innerHTML = kind.icon;
  document.getElementById('emptyTitle').textContent = kind.emptyTitle;
  document.getElementById('emptyText').textContent = kind.emptyText;
  document.getElementById('emptyBtn').textContent = kind.emptyBtn;

  /* ==================== Projects State ==================== */
  var allProjects = [];
  var projectsLoaded = false;
  var filteredProjects = [];
  var projCurrentPage = 1;
  var projPageSize = 10;
  var projSortCol = 'lastAccessed';
  var projSortDir = 'desc';
  var defaultProjectFolder = '';

  function send(action, data) {
    if (window.chrome && window.chrome.webview) {
      window.chrome.webview.postMessage(JSON.stringify({ action: action, data: data || '' }));
    }
  }

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = String(text);
    return node;
  }
  function iconButton(kindClass, title, glyph, onClick) {
    var b = el('button', 'icon-btn ' + kindClass, glyph);
    b.title = title;
    b.addEventListener('click', function(e) { e.stopPropagation(); onClick(); });
    return b;
  }

  /* This kind's projects, plus legacy "Other" ones (no longer offered for new projects). */
  function isShown(p) { return p.type === kind.type || p.type === 'Other'; }

  /* ==================== Filtering & sorting ==================== */
  function applyProjFilter() {
    var q = (document.getElementById('projSearchInput').value || '').toLowerCase().trim();
    filteredProjects = q
      ? allProjects.filter(function(p) {
          return p.name.toLowerCase().indexOf(q) >= 0 || p.type.toLowerCase().indexOf(q) >= 0;
        })
      : allProjects.slice();
    applyProjSort();
  }

  function applyProjSort() {
    filteredProjects.sort(function(a, b) {
      var av = a[projSortCol] || (typeof a[projSortCol] === 'number' ? 0 : '');
      var bv = b[projSortCol] || (typeof b[projSortCol] === 'number' ? 0 : '');
      if (typeof av === 'number' && typeof bv === 'number')
        return projSortDir === 'asc' ? av - bv : bv - av;
      av = String(av).toLowerCase(); bv = String(bv).toLowerCase();
      if (av < bv) return projSortDir === 'asc' ? -1 : 1;
      if (av > bv) return projSortDir === 'asc' ? 1 : -1;
      return 0;
    });
    projCurrentPage = 1;
    renderProjects();
  }

  function projSortBy(col) {
    if (projSortCol === col) projSortDir = projSortDir === 'asc' ? 'desc' : 'asc';
    else { projSortCol = col; projSortDir = col === 'lastAccessed' ? 'desc' : 'asc'; }
    updateProjSortHeaders();
    applyProjSort();
  }

  function updateProjSortHeaders() {
    ['name','type'].forEach(function(c) {
      var th = document.getElementById('pth-' + c);
      if (!th) return;
      var arrow = th.querySelector('.sort-arrow');
      if (c === projSortCol) {
        th.className = projSortDir === 'asc' ? 'sort-asc' : 'sort-desc';
        if (arrow) arrow.innerHTML = projSortDir === 'asc' ? '&#8593;' : '&#8595;';
      } else {
        th.className = '';
        if (arrow) arrow.innerHTML = '&#8597;';
      }
    });
  }

  function onProjPageSizeChange() {
    projPageSize = parseInt(document.getElementById('projPageSize').value, 10);
    projCurrentPage = 1;
    renderProjects();
  }
  function onProjSearch() { applyProjFilter(); }
  function goToProjPage(p) { projCurrentPage = p; renderProjects(); }

  /* ==================== Render ==================== */
  function renderProjects() {
    var tbody = document.getElementById('projectList');
    var showingEl = document.getElementById('projShowingInfo');
    var pagEl = document.getElementById('projPagination');
    var noMatchEl = document.getElementById('noMatch');

    // No projects of this kind at all: the hero replaces the table and carries the create button.
    // Until the host's first setProjects, show neither, so the hero doesn't flash for a populated list.
    if (!projectsLoaded) {
      document.getElementById('listWrap').style.display = 'none';
      document.getElementById('emptyHero').style.display = 'none';
      return;
    }
    var none = allProjects.length === 0;
    document.getElementById('listWrap').style.display = none ? 'none' : '';
    document.getElementById('emptyHero').style.display = none ? '' : 'none';
    document.getElementById('newBtn').style.visibility = none ? 'hidden' : '';
    if (none) return;

    var total = filteredProjects.length;
    var totalPages = Math.max(1, Math.ceil(total / projPageSize));
    if (projCurrentPage > totalPages) projCurrentPage = totalPages;

    var start = (projCurrentPage - 1) * projPageSize;
    var end = Math.min(start + projPageSize, total);

    if (total === 0) {
      tbody.innerHTML = '';
      noMatchEl.style.display = 'block';
      showingEl.textContent = '';
      pagEl.innerHTML = '';
      return;
    }

    noMatchEl.style.display = 'none';
    showingEl.textContent = total === 1
      ? 'Showing 1 entry'
      : 'Showing ' + (start + 1) + ' to ' + end + ' of ' + total + ' entries';

    // Rows are built with DOM calls: project names and folders reach the page as text only, and every
    // handler is a closure over the project id. No string-built inline onclick, which an "&apos;" in a
    // folder name could break out of. Open-folder posts the id; the host looks the folder up itself.
    tbody.textContent = '';
    filteredProjects.slice(start, end).forEach(function(proj) {
      var badgeClass = proj.type === 'COM Control' ? 'com' : proj.type === 'Addin' ? 'addin' : 'other';
      var tr = el('tr', 'project-row');

      var nameTd = el('td');
      var name = el('span', 'project-name', proj.name);
      name.addEventListener('click', function() { send('openProject', proj.id); });
      nameTd.appendChild(name);
      tr.appendChild(nameTd);

      var typeTd = el('td');
      typeTd.appendChild(el('span', 'type-badge ' + badgeClass, proj.type));
      tr.appendChild(typeTd);

      var actTd = el('td');
      var actions = el('div', 'row-actions');
      actions.appendChild(iconButton('icon-btn-edit', 'Edit project', '✎', function() { editProject(proj.id); }));
      actions.appendChild(iconButton('icon-btn-del', 'Remove from list', '🗑', function() { deleteProject(proj.id); }));
      actions.appendChild(iconButton('icon-btn-folder', 'Open folder', '📁', function() { send('openFolder', proj.id); }));
      actTd.appendChild(actions);
      tr.appendChild(actTd);

      tbody.appendChild(tr);
    });

    /* Pagination */
    if (totalPages <= 1) { pagEl.innerHTML = ''; return; }
    var ph = '';
    ph += '<button class="page-btn" onclick="goToProjPage(' + (projCurrentPage - 1) + ')"' +
          (projCurrentPage <= 1 ? ' disabled' : '') + '>&lt;</button>';
    var ps = Math.max(1, projCurrentPage - 2);
    var pe = Math.min(totalPages, ps + 4);
    if (pe - ps < 4) ps = Math.max(1, pe - 4);
    for (var p = ps; p <= pe; p++) {
      ph += '<button class="page-btn' + (p === projCurrentPage ? ' active' : '') +
            '" onclick="goToProjPage(' + p + ')">' + p + '</button>';
    }
    ph += '<button class="page-btn" onclick="goToProjPage(' + (projCurrentPage + 1) + ')"' +
          (projCurrentPage >= totalPages ? ' disabled' : '') + '>&gt;</button>';
    pagEl.innerHTML = ph;
  }

  function setProjects(items) {
    projectsLoaded = true;
    allProjects = (items || []).filter(isShown);
    applyProjFilter();
  }

  /* ==================== Project Modal ==================== */
  function openProjectModal(editId) {
    var modal = document.getElementById('projectModal');
    var titleEl = document.getElementById('modalTitle');
    var nameEl = document.getElementById('modalName');
    var folderEl = document.getElementById('modalFolder');
    var editIdEl = document.getElementById('modalEditId');
    var ghAcctEl = document.getElementById('modalGitHubAccount');
    var repoEl = document.getElementById('modalRepoName');
    var saveBtn = document.getElementById('modalSaveBtn');

    document.getElementById('nameError').style.display = 'none';
    document.getElementById('folderError').style.display = 'none';

    if (editId) {
      var proj = allProjects.find(function(p) { return p.id === editId; });
      if (!proj) return;
      titleEl.textContent = 'Edit Project';
      saveBtn.textContent = 'Save';
      editIdEl.value = editId;
      nameEl.value = proj.name;
      folderEl.value = proj.folder;
      ghAcctEl.value = proj.githubAccountId || '';
      repoEl.value = proj.repoName || '';
    } else {
      titleEl.textContent = kind.modalNew;
      saveBtn.textContent = 'Create';
      editIdEl.value = '';
      nameEl.value = '';
      folderEl.value = defaultProjectFolder || '';
      ghAcctEl.value = '';
      repoEl.value = '';
    }

    modal.classList.add('visible');
    nameEl.focus();
  }

  function closeProjectModal() {
    document.getElementById('projectModal').classList.remove('visible');
  }

  function saveProject() {
    var editId = document.getElementById('modalEditId').value;
    var name = document.getElementById('modalName').value.trim();
    var folder = document.getElementById('modalFolder').value.trim();

    var valid = true;
    if (!name) { document.getElementById('nameError').style.display = 'block'; valid = false; }
    else { document.getElementById('nameError').style.display = 'none'; }
    if (!folder) { document.getElementById('folderError').style.display = 'block'; valid = false; }
    else { document.getElementById('folderError').style.display = 'none'; }
    if (!valid) return;

    var githubAccountId = document.getElementById('modalGitHubAccount').value;
    var repoName = document.getElementById('modalRepoName').value.trim();
    // type only matters for a new project; an edit keeps the project's existing type.
    var data = JSON.stringify({ id: editId || '', type: kind.type, name: name, folder: folder, githubAccountId: githubAccountId, repoName: repoName });
    if (editId) { send('editProject', data); } else { send('addProject', data); }
    closeProjectModal();
  }

  function editProject(id) { openProjectModal(id); }
  function deleteProject(id) { send('deleteProject', id); }
  function browseProjectFolder() {
    var editId = document.getElementById('modalEditId').value || '';
    send('browseProjectFolder', editId);
  }

  /* ==================== Messages from C# ==================== */
  if (window.chrome && window.chrome.webview) {
    window.chrome.webview.addEventListener('message', function(e) {
      var msg = e.data;
      if (typeof msg === 'string') { try { msg = JSON.parse(msg); } catch(ex) { return; } }
      if (msg.type === 'setProjects') setProjects(msg.items);
      if (msg.type === 'setGitHubAccounts') {
        var sel = document.getElementById('modalGitHubAccount');
        var curVal = sel.value;
        sel.innerHTML = '<option value="">(none)</option>';
        (msg.accounts || []).forEach(function(a) {
          var opt = document.createElement('option');
          opt.value = a.id;
          var provIcon = a.provider === 'bitbucket' ? 'BB' : 'GH';
          opt.textContent = a.displayName + ' [' + provIcon + '] (' + a.username + ')';
          sel.appendChild(opt);
        });
        sel.value = curVal;
      }
      if (msg.type === 'setTheme') {
        document.body.classList.toggle('light', msg.theme === 'light');
      }
      if (msg.type === 'setDefaultProjectFolder') {
        defaultProjectFolder = msg.folder || '';
      }
      if (msg.type === 'browseResult') {
        if (msg.folder) document.getElementById('modalFolder').value = msg.folder;
      }
    });
  }

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeProjectModal();
  });

  renderProjects();
</script>
</body>
</html>
